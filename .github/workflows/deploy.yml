name: Render and Deploy CV

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          uv venv
          uv pip install rendercv

      - name: Render CV
        run: |
          # Activate virtual environment and render the CV
          source .venv/bin/activate
          rendercv render Miquel_Obrador_Reina_CV.yaml

      - name: Prepare deployment folder
        run: |
          mkdir -p public
          # RenderCV typically outputs a folder named `rendercv_output`
          # We copy all output files to our public directory
          cp -r rendercv_output/* public/
          
          # Rename the HTML file to index.html so it serves as the root website
          # (RenderCV names the HTML file based on the name in the YAML)
          mv public/*.html public/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4